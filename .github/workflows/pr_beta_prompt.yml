name: PR beta publish prompt

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: pr-beta-prompt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    # Same-repo PRs (including Renovate) upsert this comment in test.yml to avoid an extra queued job.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Upsert beta publish comment
        uses: actions/github-script@v9.0.0
        env:
          IS_SAME_REPO: 'false'
        with:
          script: |
            const upsert = require('./.github/scripts/upsert-pr-beta-comment.js');
            await upsert({ github, context });
